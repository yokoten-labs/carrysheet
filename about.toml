# cargo-about (https://github.com/EmbarkStudios/cargo-about): finds the
# license text of every crate the release binary ships (issue 95). A release
# step only, not a dependency: the release workflow runs
# `cargo about generate --format json --fail` and turns the JSON into
# THIRD-PARTY-NOTICES.txt. Keep `accepted` in step with deny.toml's
# [licenses] allow list, plus the program's own GPL.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "GPL-3.0-or-later",
]
# The release targets; deny.toml checks the same ones.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Only what ends up in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
