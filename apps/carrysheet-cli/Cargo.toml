[package]
name = "carrysheet-cli"
version = "0.1.0"
description = "Carrysheet on the command line, with an MCP server for AI agents."
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "carrysheet-cli"
path = "src/main.rs"

[dependencies]
carrysheet-commands = { path = "../../crates/carrysheet-commands", version = "0.1.0" }
carrysheet-model = { path = "../../crates/carrysheet-model", version = "0.1.0" }
# Read-only SQL over sheets; with the `query` feature this program is also
# its query worker (`__query-worker`, see main.rs).
carrysheet-query = { path = "../../crates/carrysheet-query", version = "0.1.0", optional = true }
carrysheet-vba = { path = "../../crates/carrysheet-vba", version = "0.1.0" }
# `macros` opens .xlsm/.xlsb packages: our hardened zip reader.
carrysheet-zip = { path = "../../crates/carrysheet-zip", version = "0.1.0" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color", "string", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# MCP server over stdio and streamable HTTP. Exact pin: the Rust SDK is beta
# for the 2026-07-28 spec.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
# `mcp serve --http`: a plain HTTP/1.1 server on loopback in front of rmcp's
# streamable-HTTP service. Only the server half of hyper, no TLS, no HTTP/2.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# Already dependencies of rmcp's HTTP server; named here for the body types.
bytes = { version = "1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
# The HTTP token: 256 bits from the operating system's random source, compared
# in constant time. Both were already in Cargo.lock.
getrandom = "0.4.3"
subtle = "2.6.1"
# Supply chain: Cargo.lock holds tokio 1.53.3, not 1.54.0 (released the day
# before this was added); tokio-util 0.7.20, uuid 1.28.0 and schemars 1.2.3
# were each at least a week old. Take new releases only once they have aged a
# week: `cargo update -p <crate> --precise <version>`.
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "net", "time", "sync", "signal"] }
# Only to forward rmcp's warnings to our log; already a dependency of rmcp.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# `mcp serve --http` raises the soft open-file limit (macOS starts programs
# with 256). Already in Cargo.lock through clap's terminal_size; 1.1.5 was
# published 2026-09-16. Its getrlimit and setrlimit are safe functions.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

[features]
# SQLite adds about 1.6 MB (+62%) to the binary, so it is off until the
# command that uses it lands; that PR turns it on by default.
query = ["dep:carrysheet-query"]

[dev-dependencies]
# The tests build zip packages byte by byte with carrysheet-zip's test
# builder (included by path), which deflates with flate2.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
