[package]
name = "carrysheet-bench"
version.workspace = true
description = "Times Carrysheet's readers and writers on fixed files and catches slowdowns and memory growth against a committed baseline."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

# Only std and our own crates: the bench must not pull anything new into the
# workspace. The compound-file writer comes through carrysheet-vba's `cfb`
# re-export, and the legacy encoder through carrysheet-csv's `encoding_rs`
# re-export.
[dependencies]
carrysheet-biff.workspace = true
carrysheet-crypto.workspace = true
carrysheet-csv.workspace = true
carrysheet-numbers.workspace = true
carrysheet-vba.workspace = true

[lints]
workspace = true
