[package]
name = "carrysheet-crypto"
version.workspace = true
description = "Detect, decrypt and re-encrypt password-protected Excel files (MS-OFFCRYPTO): agile and standard .xlsx, RC4 and XOR .xls; explain Rights Management"
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
carrysheet-cfb.workspace = true
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
md-5 = { version = "0.11.0", features = ["zeroize"] }
quick-xml = "0.42.0"
rc4 = { version = "0.2.0", features = ["zeroize"] }
sha1 = { version = "0.11.0", features = ["zeroize"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = "1.9.1"

# wasm32-unknown-unknown has no operating system to ask for random bytes;
# the `wasm_js` backend asks the browser (crypto.getRandomValues).
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[lints]
workspace = true
