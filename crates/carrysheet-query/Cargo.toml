[package]
name = "carrysheet-query"
version = "0.1.0"
description = "Run read-only SQL over sheets and tables, in an in-memory SQLite with limits."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
carrysheet-model = { path = "../carrysheet-model", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# SQLite is C code, compiled by `bundled` (SQLite itself is public domain).
# The web (wasm32) build leaves it out: there the crate has the input types,
# header naming and date helper, but no QueryEngine.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled",
    "column_decltype",
    "functions",
    "hooks",
    "limits",
] }

# The query worker caps its own address space (RLIMIT_AS) without unsafe
# code. Already in Cargo.lock through tempfile and terminal_size.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

# The test binary is its own query worker, so it has its own main.
[[test]]
name = "worker"
harness = false

[lints]
workspace = true
