syntax = "proto2";

import "TSP.proto";

package TN;

message DocumentArchive {
  repeated .TSP.Reference sheets = 1;
}

message SheetArchive {
  required string name = 1;
  repeated .TSP.Reference drawable_infos = 2;
}
