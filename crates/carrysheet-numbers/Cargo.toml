[package]
name = "carrysheet-numbers"
version = "0.1.0"
description = "Read Apple Numbers (.numbers) spreadsheets in pure Rust, safely."
license = "MIT OR Apache-2.0"
keywords = ["numbers", "iwork", "spreadsheet", "apple", "iwa"]
categories = ["parser-implementations"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# The code generator is a separate tool for maintainers.
exclude = ["codegen"]

[dependencies]
# Only the derive macros and the runtime; the generated code is committed.
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
# The hardened zip reader every Carrysheet reader shares (issue 40):
# Stored and Deflate only, inflated by the pure-Rust miniz_oxide.
carrysheet-zip = { path = "../carrysheet-zip", version = "0.1.0" }

[dev-dependencies]
# The tests build zip files byte by byte with carrysheet-zip's test builder
# (included by path), which deflates with flate2.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Only to unpack the fixtures' Snappy blocks for the mutation test.
snap = "1.1.2"

[lints]
workspace = true
