[package]
name = "carrysheet-commands"
version = "0.1.0"
description = "Carrysheet's command table: one source for the CLI, the MCP tools and their JSON schemas, plus errors and the engine interface."
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
carrysheet-model = { path = "../carrysheet-model", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# The in-memory engine, for tests of crates that use this one.
test-engine = []

[lints]
workspace = true
