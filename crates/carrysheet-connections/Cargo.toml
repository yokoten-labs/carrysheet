[package]
name = "carrysheet-connections"
version = "0.1.0"
description = "Find and describe a workbook's data connections, query tables, external links, Power Query and data model, with secrets masked"
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Inflate for the zip inside a Power Query DataMashup. The zlib-rs backend is
# pure Rust and already in Cargo.lock; no C compiler, builds for wasm32.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
quick-xml = { version = "0.41.0", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
