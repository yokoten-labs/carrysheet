# CI for every pull request and every push to main. Plain cargo commands and
# two Node scripts (the line cap and the vendor check); no wrapper script.
# A pull request is merged only when every job here is green.
#
# The Rust version lives in rust-toolchain.toml only; rustup reads it. The
# msrv job is the one job that names another version (the workspace's
# rust-version, Cargo.toml).
#
# Every action is pinned to a full commit SHA; the comment says which tag.
# To update one, look up the new tag's commit (gh api
# repos/<owner>/<repo>/git/ref/tags/<tag>, dereferencing an annotated tag)
# and take only releases that are at least a week old.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Record 0010 decision 8: the 5,000-line cap. No Rust, answers in seconds.
  # --max is the ceiling of the current step; the pull request that reaches
  # 5,000 deletes the option.
  lines:
    name: lines (the 5,000-line cap)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test scripts/tests/lines.test.mjs
      - run: node scripts/lines.mjs --max 10900

  # Record 0009 decision 5.1: vendor/gridcraft is upstream at the pinned
  # commit plus our patch files. verify fetches that commit (network).
  vendor:
    name: vendor (upstream plus patch files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test scripts/tests/vendor.test.mjs
      - run: node scripts/vendor.mjs verify

  # fmt, clippy and tests on every OS. Clippy on Windows and macOS lints the
  # code behind #[cfg(windows)] and #[cfg(target_os = "macos")].
  test:
    name: fmt, clippy, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The shipped CLI links miniz_oxide; the workspace run unifies to
      # zlib-rs. Test the zip reader on each.
      - name: zip-inflaters
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p carrysheet-zip --features test-miniz
          cargo test --locked -p carrysheet-zip --features test-zlib-rs

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # A prebuilt cargo-deny, checksum-verified by the action.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # The libraries for the browser (the `wasm-check` alias in
  # .cargo/config.toml: every library, without carrysheet-cli).
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo wasm-check

  windows-gnu:
    name: windows-gnu build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            linker: gcc-mingw-w64-x86-64
          - target: i686-pc-windows-gnu
            linker: gcc-mingw-w64-i686
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ${{ matrix.linker }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --workspace --target ${{ matrix.target }}

  # The workspace's rust-version (Cargo.toml). The one job that names a
  # version; RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
  msrv:
    name: cargo check on rust-version (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --locked --all-targets

  # Build a release binary with build-machine paths remapped, then search it
  # for the home folder, any /home/ path, the user name and email addresses.
  # Any hit fails.
  # Why: build-machine data in a release binary identifies who built it.
  # Fix: find the source and add a --remap-path-prefix rule here, or remove
  # the string. grep prints nothing about the match, so the log stays safe.
  release-scan:
    name: release privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build with remapped paths, then scan the binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=/carrysheet"
          cargo build --release --locked -p carrysheet-cli
          bin=target/release/carrysheet-cli
          ls -l "$bin"
          if grep -a -F -e "$HOME" -e /home/ "$bin" >/dev/null || grep -a -w -F "$(id -un)" "$bin" >/dev/null; then
            echo "build-machine data found in the release binary" >&2; exit 1
          fi
          echo "release scan: no build-machine paths or user name"
      # Any email address except the project's own (carrysheet.com), case
      # ignored. At least two characters before the @: a float constant
      # ending in 0x40 (`@`) can put one letter-like byte before it, which
      # looked like an address. Strings sit back to back, so a match can run
      # on into the next one; the domain is compared by prefix. Only a count
      # is printed.
      - name: Scan the binary for email addresses
        run: |
          hits=$(LC_ALL=C grep -a -o -i -E '[a-z0-9._%+-]{2,}@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}' target/release/carrysheet-cli | LC_ALL=C grep -c -v -i -F '@carrysheet.com' || true)
          if [ "$hits" -ne 0 ]; then
            echo "$hits email address(es) found in the release binary" >&2; exit 1
          fi
          echo "release scan: clean"
