# Release carrysheet-cli from a tag (issues 94, 95 and 97).
#
# Tag vX.Y.Z (the workspace version) builds an archive per target with
# remapped paths, runs CI's privacy scan on each binary, writes
# THIRD-PARTY-NOTICES.txt with cargo-about, writes SHA256SUMS and creates a
# DRAFT release. The owner publishes the draft by hand. Run by hand
# (workflow_dispatch), it is a dry run: no attestation, no release.
#
# Every action is pinned to a full commit SHA (ci.yml says how to update one).
# No build cache: nothing a pull request put in a cache reaches a release.
# The only token with write access is behind the protected `release`
# environment.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  prepare:
    name: version, notes, third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # One version for both crates; on a tag, the tag names it.
      - name: Check the version
        id: version
        run: |
          meta=$(cargo metadata --locked --no-deps --format-version 1)
          [ "$(jq '[.packages[].version] | unique | length' <<< "$meta")" = 1 ] || { echo "crates differ in version"; exit 1; }
          version=$(jq -r '.packages[0].version' <<< "$meta")
          if [ "$DRY_RUN" = false ] && [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "tag $GITHUB_REF does not match workspace version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The CHANGELOG section of this version; a dry run may use Unreleased.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          section() { awk -v h="$1" '/^## /{p = index($0, "## " h) == 1; next} p' CHANGELOG.md; }
          section "v$VERSION" > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            [ "$DRY_RUN" = true ] || { echo "CHANGELOG.md has no section v$VERSION"; exit 1; }
            section Unreleased > dist/notes.md
          fi
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      # --fail: a shipped crate whose license is not accepted (about.toml)
      # or cannot be found stops the release.
      - name: THIRD-PARTY-NOTICES.txt
        run: |
          cargo about generate --format json --fail --locked -m apps/carrysheet-cli/Cargo.toml -o target/about.json
          jq -r '.licenses[] | "==== \(.name) (\(.id))\nUsed by: \([.used_by[].crate | "\(.name) \(.version)"] | join(", "))\n\n\(.text)\n"' \
            target/about.json > dist/THIRD-PARTY-NOTICES.txt
          [ -s dist/THIRD-PARTY-NOTICES.txt ] && grep -c '^==== ' dist/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-docs
          path: dist/
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      VERSION: ${{ needs.prepare.outputs.version }}
      WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add "$TARGET"
      # Paths of the build machine become ~ and /carrysheet in the binary.
      - name: Build with remapped paths
        run: |
          home="${USERPROFILE:-$HOME}"
          export RUSTFLAGS="--remap-path-prefix=$home=~ --remap-path-prefix=$WORKSPACE=/carrysheet"
          cargo build --release --locked -p carrysheet-cli --target "$TARGET"
          ls -l "target/$TARGET/release/carrysheet-cli$EXE"
      # The privacy scan of ci.yml's release-scan job, on every target.
      - name: Scan the binary for build-machine paths and the user name
        run: |
          bin="target/$TARGET/release/carrysheet-cli$EXE" user="${USERNAME:-$(id -un)}"
          if grep -a -F -e "$HOME" -e "${USERPROFILE:-$HOME}" -e /home/ -e /Users/ "$bin" >/dev/null \
            || grep -a -w -F "$user" "$bin" >/dev/null; then
            echo "build-machine data found in the release binary" >&2; exit 1
          fi
          echo "release scan: no build-machine paths or user name"
      - name: Scan the binary for email addresses
        run: |
          hits=$(LC_ALL=C grep -a -o -i -E '[a-z0-9._%+-]{2,}@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}' "target/$TARGET/release/carrysheet-cli$EXE" \
            | LC_ALL=C grep -c -v -i -F '@carrysheet.com' || true)
          if [ "$hits" -ne 0 ]; then echo "$hits email address(es) found in the release binary" >&2; exit 1; fi
          echo "release scan: clean"
      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          out=$("target/$TARGET/release/carrysheet-cli$EXE" --version)
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "--version does not say $VERSION"; exit 1 ;; esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs
          path: docs-dist
      # carrysheet-cli-<version>-<target>/: the program, the licenses, the
      # notices, README and CHANGELOG. .zip for Windows, .tar.gz elsewhere.
      - name: Archive
        run: |
          name="carrysheet-cli-$VERSION-$TARGET"; mkdir -p "stage/$name" out
          cp "target/$TARGET/release/carrysheet-cli$EXE" README.md CHANGELOG.md LICENSING.md LICENSE-GPL LICENSE-MIT LICENSE-APACHE \
            docs-dist/THIRD-PARTY-NOTICES.txt "stage/$name/"
          cp vendor/gridcraft/NOTICE "stage/$name/GRIDCRAFT-NOTICE"
          cd stage
          case "$TARGET" in
            *windows*) 7z a -tzip -mx=9 "../out/$name.zip" "$name" > /dev/null ;;
            *) tar -czf "../out/$name.tar.gz" "$name" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: check archives, write SHA256SUMS
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Every target, with notices and licenses
        working-directory: dist
        run: |
          for t in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            a=$(ls "carrysheet-cli-$VERSION-$t".* 2>/dev/null) || { echo "No archive for $t."; exit 1; }
            case "$a" in *.zip) list=$(unzip -Z1 "$a") ;; *) list=$(tar -tzf "$a") ;; esac
            for f in THIRD-PARTY-NOTICES.txt LICENSE-GPL LICENSE-MIT LICENSE-APACHE GRIDCRAFT-NOTICE; do
              grep -qx "carrysheet-cli-$VERSION-$t/$f" <<< "$list" || { echo "$a has no $f."; exit 1; }
            done
          done
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum carrysheet-cli-* > SHA256SUMS
          { echo "### carrysheet-cli $VERSION (dry run: $DRY_RUN)"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and create the draft release
    needs: [prepare, checksums]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected: the owner sets required reviewers on this environment, so a
    # tag waits for approval before the write token is used.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs
          path: docs-dist
      - run: cd dist && sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/carrysheet-cli-*
      # A draft: nothing is public until the owner publishes it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" --draft --verify-tag --title "Carrysheet v$VERSION" \
            --notes-file docs-dist/notes.md dist/carrysheet-cli-* dist/SHA256SUMS
