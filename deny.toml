# cargo-deny policy: which dependencies Carrysheet may use.
# Run: cargo deny check   (install: cargo install --locked cargo-deny)
# More in docs/dependencies.md.

[graph]
# Check the dependency graph for every platform we ship, not only the one
# that runs the check, so a Windows-only or macOS-only crate is checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "i686-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# The RustSec advisory database (the default, written out so it is visible).
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked version was pulled by its author, usually for a bug or a security
# problem. Never ship one.
yanked = "deny"
# Unmaintained or unsound crates fail anywhere in the graph, not only our
# direct dependencies. A known case we accept goes in `ignore` as `{ id,
# reason }`, and the reason names a date to look at it again (cargo-deny
# 0.19 has no expiry key).
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained and has no fixed release; rmcp (MCP server, kept by record 0009) requires it. Look again 2027-02-27." },
]

[licenses]
# Allowed for everything, because crates/ (MIT OR Apache-2.0) may only use
# permissive licenses: people must be able to use our libraries in closed
# products. Not here on purpose: MPL-2.0, LGPL, GPL, AGPL, and anything
# unknown. A dependency licensed "X OR Y" passes if either side is allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]
# The list is a policy, not an inventory: don't warn for unused entries.
unused-allowed-license = "allow"
# Detected license files must match closely before they count.
confidence-threshold = 0.93
# Dev-dependencies (e.g. proptest) are not shipped, so they are not checked.
include-dev = false

# Per-folder rules. cargo-deny has one allow-list for the whole workspace and
# cannot say "only for apps/". So:
#  - our own GPL programs in apps/ get an exception for their own license;
#  - a GPL-compatible dependency that only an app may use (MPL-2.0, LGPL,
#    GPL-3.0) gets a license exception here AND a [bans] `deny` entry with
#    `wrappers` naming the apps, so a library in crates/ can't take it in
#    directly. Example (keep both halves together):
#      exceptions: { crate = "some-mpl-crate", allow = ["MPL-2.0"] }
#      bans.deny:  { crate = "some-mpl-crate", wrappers = ["carrysheet-cli"], reason = "MPL-2.0: apps only" }
#    Note `wrappers` stops other direct users only; reviewers still check that
#    no permissive crate in crates/ pulls it in through a third crate.
exceptions = [
    { crate = "carrysheet-cli", allow = ["GPL-3.0-or-later"] },
]

[licenses.private]
# Our crates are checked like everyone else's (none set publish = false yet).
ignore = false

[bans]
# Two versions of one crate cost build time and binary size, but are often
# out of our hands (a dependency lags behind). Warn, and fix when we can.
multiple-versions = "warn"
# `version = "*"` takes whatever is newest, which breaks the lockfile review
# and the 7-day cooldown. Path dependencies also need a version.
wildcards = "deny"
highlight = "all"
deny = [
    # No HTTP or TLS anywhere in the graph.
    { crate = "hyper", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    { crate = "h2", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    { crate = "reqwest", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    { crate = "ureq", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    { crate = "rustls", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    { crate = "native-tls", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    { crate = "openssl", reason = "No network code in the binary (record 0010, decision 4): MCP runs over stdio only." },
    # Fences (record 0010, decision 9): GridCraft only behind carrysheet-kernel,
    # the MCP runtime only in the program. `wrappers` names the crates that may
    # depend on each directly; GridCraft's own crates may use each other.
    { crate = "gridcraft-engine", wrappers = ["carrysheet-kernel"], reason = "GridCraft is used only through carrysheet-kernel." },
    { crate = "gridcraft-xlsx", wrappers = ["carrysheet-kernel", "gridcraft-engine"], reason = "GridCraft is used only through carrysheet-kernel." },
    { crate = "gridcraft-calc", wrappers = ["gridcraft-chart", "gridcraft-engine"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-chart", wrappers = ["gridcraft-engine"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-core", wrappers = ["gridcraft-calc", "gridcraft-chart", "gridcraft-engine", "gridcraft-formula", "gridcraft-functions", "gridcraft-model", "gridcraft-numfmt", "gridcraft-xlsx"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-formula", wrappers = ["gridcraft-calc", "gridcraft-engine", "gridcraft-model", "gridcraft-xlsx"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-functions", wrappers = ["gridcraft-calc", "gridcraft-engine"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-model", wrappers = ["gridcraft-calc", "gridcraft-chart", "gridcraft-engine", "gridcraft-xlsx"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-numfmt", wrappers = ["gridcraft-calc", "gridcraft-chart", "gridcraft-engine"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "gridcraft-pdf", wrappers = ["gridcraft-engine"], reason = "Inside GridCraft only; Carrysheet uses gridcraft-engine and gridcraft-xlsx." },
    { crate = "rmcp", wrappers = ["carrysheet-cli"], reason = "The MCP server belongs to the program; libraries stay bytes in, JSON out." },
    { crate = "tokio", wrappers = ["carrysheet-cli", "rmcp", "tokio-util"], reason = "The async runtime serves MCP in the program only." },
]
skip = []

[sources]
# Only crates.io. A git or other registry dependency skips crates.io's
# immutable versions and the advisory database, so it needs a deliberate
# change here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
